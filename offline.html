<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a11">
<title>MaperChess — нет сети</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: radial-gradient(60% 45% at 50% 35%, #1a1c22 0%, #0c0a11 75%); color: #eceae4;
         font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
  main { max-width: 360px; }
  .k { font-size: 64px; line-height: 1; margin-bottom: 14px; color: #b98bf5; }
  h1 { margin: 0 0 10px; font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 600; }
  p { margin: 0 0 22px; color: #9c9ca6; line-height: 1.55; font-size: 14.5px; }
  button { min-height: 48px; padding: 0 26px; border: 0; border-radius: 14px; font: 700 15px inherit; color: #fff;
           background: linear-gradient(180deg, #8e55e6, #5f2fb8); cursor: pointer; }
  button:focus-visible { outline: 3px solid #dcc6ff; outline-offset: 3px; }
  small { display: block; margin-top: 18px; color: #6b6d77; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="k" aria-hidden="true">&#9822;</div>
  <h1 id="t">Нет подключения</h1>
  <p id="d">Для игры нужен интернет: шахматный движок и сохранение прогресса загружаются из сети. Проверьте соединение — ваш прогресс на устройстве не потерян.</p>
  <button type="button" id="b">Попробовать снова</button>
  <small>MaperChess</small>
</main>
<script>
  if ((navigator.language || "").slice(0, 2) !== "ru") {
    document.documentElement.lang = "en";
    document.title = "MaperChess — offline";
    document.getElementById("t").textContent = "You're offline";
    document.getElementById("d").textContent = "MaperChess needs an internet connection: the chess engine and progress sync load from the network. Check your connection — your progress on this device is safe.";
    document.getElementById("b").textContent = "Try again";
  }
  document.getElementById("b").addEventListener("click", function () { location.reload(); });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
