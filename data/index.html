<script>
/* Загрузочный экран нужен только при настоящем запуске приложения.
   Пока приложение не закрыто (sessionStorage живёт, пока его не закрыли), при возврате в него и при перезагрузке
   страницы системой экран загрузки НЕ показывается — игрок сразу попадает туда, где был.
   Принудительно показать загрузку: добавьте к адресу ?splash=1 */
(function () {
  var warm = false, now = Date.now();
  try {
    var nav = ((performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {}).type || "navigate";
    var seen = +localStorage.getItem("mc_last_seen") || 0;
    warm = sessionStorage.getItem("mc_boot") === "1" ||
           ((nav === "reload" || nav === "back_forward") && seen > 0 && now - seen < 30 * 60 * 1000);
    if (/[?&]splash=1/.test(location.search)) warm = false;
    window.__mcLastView = sessionStorage.getItem("mc_view");      /* раздел, где игрок был; читаем сразу, пока модули его не перезаписали */
    sessionStorage.setItem("mc_boot", "1");
  } catch (e) {}
  window.__mcWarm = warm;
  if (warm) document.documentElement.className += " warm";
  function stamp() { try { localStorage.setItem("mc_last_seen", String(Date.now())); } catch (e) {} }
  document.addEventListener("visibilitychange", function () { if (document.hidden) stamp(); });
  window.addEventListener("pagehide", stamp);
  stamp();
})();
</script>

/* ===== PRELOADER: рыцарь обходит всю доску, прогресс = клетки ===== */
#preloader{
  position:fixed;inset:0;z-index:9999;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  --p:0;background:radial-gradient(60% 45% at 50% 42%,#231a3d 0%,#0c0a11 75%);
  font-family:'Onest',system-ui,sans-serif;
  transition:opacity .5s ease,visibility .5s ease;
}
#preloader.done{opacity:0;visibility:hidden;pointer-events:none}
.pl-glow{
  position:absolute;width:420px;height:420px;border-radius:50%;top:calc(50% - 250px);
  background:radial-gradient(circle,rgba(142, 85, 230,.5) 0%,transparent 66%);
  opacity:calc(.1 + var(--p)*.3);transition:opacity .2s linear;
}
.pl-board{
  position:relative;width:min(272px,72vw);aspect-ratio:1;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -24px rgba(0,0,0,.9);
}
.pl-board svg,.pl-board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#pl-svg{transition:opacity .6s ease}
#preloader.ready #pl-svg{opacity:.3}
.pl-sq{transition:fill .4s ease}
.pl-sq.l{fill:rgba(255,255,255,.06)}.pl-sq.d{fill:rgba(255,255,255,.015)}
.pl-sq.l.on{fill:rgba(142, 85, 230,.26)}.pl-sq.d.on{fill:rgba(142, 85, 230,.16)}
#pl-trail{fill:none;stroke:#b98bf5;stroke-opacity:.3;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s ease}
#preloader.ready #pl-trail{stroke:#e3bf7c;stroke-opacity:.6}
.pl-board{transition:transform .6s ease,box-shadow .6s ease}
#preloader.ready .pl-board{transform:scale(1.03);box-shadow:0 0 70px -8px rgba(142, 85, 230,.6)}
#preloader.ready #pl-knight{opacity:0}
#pl-knight{transition:transform .12s ease-out,opacity .3s ease}
#pl-knight text{font-size:17px;fill:#f6f2e6;stroke:#0c0a11;stroke-width:1.1;paint-order:stroke;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",sans-serif}
.pl-ring{fill:none;stroke:#b98bf5;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:plRing 1.2s ease-out infinite}
@keyframes plRing{from{opacity:.9;transform:scale(.7)}to{opacity:0;transform:scale(1.5)}}
.pl-brand{display:flex;align-items:center;gap:10px}
.pl-mark{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(142,85,230,.7))}
.pl-name{font-family:'Unbounded',Georgia,serif;font-size:26px;font-weight:600;color:#eceae4;letter-spacing:-.02em}
.pl-status{display:flex;gap:10px;align-items:baseline;margin-top:-10px;font-size:13px;font-weight:600;color:#9c9ca6}
.pl-pct{min-width:38px;text-align:right;font-weight:800;color:#eceae4;font-variant-numeric:tabular-nums}
.pl-snd{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;font-size:12px;font-weight:600;color:#8d8d99;opacity:0;pointer-events:none;transition:opacity .4s ease}
.pl-snd.show{opacity:1;animation:plSnd 1.8s ease-in-out infinite}
@keyframes plSnd{0%,100%{color:#8d8d99}50%{color:#e3d2ff}}
@media (prefers-reduced-motion: reduce){.pl-snd.show{animation:none}.pl-ring{animation:none}#pl-knight,.pl-sq{transition:none}}
</style>

<script>
(function(){
  /* ===== ЛОГОТИП: прозрачный знак assets/logo-mark.png (фон вырезать не нужно) ===== */
  var LOGO_URL = 'assets/logo-mark.png?v=2';
  function useLogo(url, withPreloader){
    if (withPreloader) plSetLogo(url);
    var applyBrand = function(){ document.querySelectorAll('.brand-logo').forEach(function(b){ b.src = url; }); };
    if (document.querySelector('.brand-logo')) applyBrand();
    else window.addEventListener('load', applyBrand);
  }
  function loadLogo(withPreloader){ useLogo(LOGO_URL, withPreloader); }
  /* возврат в приложение: загрузочного экрана нет — убираем его сразу и больше ничего не рисуем */
  if (window.__mcWarm){
    var p0 = document.getElementById('preloader'); if (p0 && p0.parentNode) p0.parentNode.removeChild(p0);
    loadLogo(false);
    return;
  }
  loadLogo(true);

  var T=[57,40,50,56,41,58,48,33,16,1,11,5,15,30,47,62,52,46,63,53,59,49,32,42,36,26,43,60,54,39,22,7,13,23,6,12,2,8,25,35,45,55,61,51,34,28,38,44,29,19,9,24,18,3,20,37,31,14,4,21,27,10,0,17];
  var ru=(navigator.language||'').slice(0,2)==='ru';
  var MSG=ru?['Расставляем фигуры','Размечаем доску','Делаем первый ход']:['Setting up the pieces','Drawing the board','Making the first move'];
  var pct=document.getElementById('pl-pct'), msg=document.getElementById('pl-msg');
  var snd=document.getElementById('pl-snd'); if(snd) snd.textContent=ru?'Коснись экрана — включится звук':'Tap the screen to turn on sound';
  var pre=document.getElementById('preloader'), svg=document.getElementById('pl-svg');
  var trail=document.getElementById('pl-trail'), knight=document.getElementById('pl-knight');
  var NS='http://www.w3.org/2000/svg', S=20, sq=[], pts=[], i;
  for(i=0;i<64;i++){
    var r=document.createElementNS(NS,'rect'), rr=(i/8)|0, cc=i%8;
    r.setAttribute('x',cc*S);r.setAttribute('y',rr*S);r.setAttribute('width',S);r.setAttribute('height',S);
    r.setAttribute('class','pl-sq '+((rr+cc)%2?'d':'l'));
    svg.insertBefore(r,trail);sq[i]=r;
  }
  var cv=document.getElementById('pl-cv'), cx=cv.getContext('2d'), T8=cv.width/8, lg=null, act=[];
  function plSetLogo(url){
    var im=new Image();
    im.onload=function(){
      var c=document.createElement('canvas'); c.width=c.height=cv.width;
      var k=Math.min(c.width/im.width,c.height/im.height)*0.9, w=im.width*k, hh=im.height*k;
      c.getContext('2d').drawImage(im,(c.width-w)/2,(c.height-hh)/2,w,hh);
      lg=c;
    };
    im.src=url;
  }
  function paint(now){
    if(lg){
      for(var n=act.length-1;n>=0;n--){
        var q=act[n], a=Math.min(1,(now-q.t)/420), sx=(q.s%8)*T8, sy=((q.s/8)|0)*T8;
        cx.clearRect(sx,sy,T8,T8); cx.globalAlpha=a; cx.drawImage(lg,sx,sy,T8,T8,sx,sy,T8,T8); cx.globalAlpha=1;
        if(a>=1) act.splice(n,1);
      }
    }
    if(pre.parentNode) requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);
  var MIN_TIME=2000, MAX_TIME=6000, start=performance.now(), loaded=false, idx=0, shown=-1, finished=false;
  function target(){
    if(loaded) return 100;
    var t=(performance.now()-start)/MAX_TIME;
    return Math.min(90,90*Math.pow(t,0.6));
  }
  function visit(){
    var s=T[idx], x=(s%8)*S, y=((s/8)|0)*S;
    sq[s].setAttribute('class',sq[s].getAttribute('class')+' on'); act.push({s:s,t:performance.now()});
    pts.push((x+S/2)+','+(y+S/2)); trail.setAttribute('points',pts.join(' '));
    knight.style.transform='translate('+x+'px,'+y+'px)';
    idx++;
    var p=idx/64; pre.style.setProperty('--p',p);
    pct.textContent=Math.round(p*100)+'%';
    var m=idx<22?0:idx<44?1:2; if(m!==shown){ if(shown!==-1 && window.PlSound) PlSound.stage(m); shown=m;msg.textContent=MSG[m];}
    if(window.PlSound){ PlSound.step(idx,p); if(idx===56) PlSound.riser(); }
  }
  function close(){
    pre.classList.add('done'); if(window.PlSound) PlSound.end();
    setTimeout(function(){ if(pre.parentNode) pre.remove(); },600);
  }
  var iv=setInterval(function(){
    if(idx<64 && idx<Math.ceil(target()/100*64)) visit();
    if(idx>=64 && !finished){
      finished=true; clearInterval(iv); pre.classList.add('ready'); if(window.PlSound) PlSound.finale();
      var wait=Math.max(0,MIN_TIME-(performance.now()-start))+350;
      setTimeout(close,wait);
    }
  },36);
  visit();
  window.addEventListener('load',function(){ loaded=true; });
  setTimeout(function(){ if(document.body.contains(pre)) close(); },MAX_TIME+1500);
})();
</script>

    <section id="view-profile" class="view">

  <div class="modal" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button class="modal-x" id="modal-close" type="button" aria-label="Close"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>
      <h3 id="modal-title">Victory!</h3>
      <p id="modal-sub">—</p>
      <div id="modal-achievements"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-retry">Play again</button>
        <button class="btn btn-primary" id="modal-next" hidden>Next level →</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settings-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-x" id="settings-close" type="button" aria-label="Close"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>

      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost ctrl-danger" id="btn-reset" data-i18n="settings.resetProgress">Reset progress</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
